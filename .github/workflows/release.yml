name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A release that has not passed the emergency-restore test is not a release.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Stock zstd and tar
        run: |
          command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }

      - name: Stock age binary
        run: make tools

      - run: make check

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` needs the tags

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # The tag name goes through the environment, never interpolated straight
      # into a shell line.
      - name: Build every platform
        env:
          TAG: ${{ github.ref_name }}
        run: make dist VERSION="$TAG"

      - name: Third-party licenses
        run: ./scripts/third-party-licenses.sh dist/THIRD_PARTY_LICENSES.md

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS dist/THIRD_PARTY_LICENSES.md
