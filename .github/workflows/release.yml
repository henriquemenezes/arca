name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Keep in sync with GREL_VER in the Makefile.
  GORELEASER_VERSION: v2.18.2

jobs:
  # A release that has not passed the emergency-restore test is not a release.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Stock zstd and tar
        run: |
          command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }

      - name: Stock age binary
        run: make tools

      - run: make check

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the artefacts
      id-token: write # the OIDC token cosign and the attestation sign with
      attestations: write # store the provenance next to the artefacts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag and the changelog need the full history

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # Keyless: the signing identity is this workflow, proven by the OIDC
      # token and recorded in Sigstore's transparency log. There is no private
      # key to leak, which is the point for a tool that handles age keys.
      # Pinned to a patch release on purpose: this action publishes v3 as a
      # floating major but nothing for v4, so `@v4` does not resolve.
      - uses: sigstore/cosign-installer@v4.1.2

      # GoReleaser shells out to syft to produce the SBOMs.
      - uses: anchore/sbom-action/download-syft@v0

      # Written from CHANGELOG.md, and fails the release if the tag has no
      # section there - an unnoticed empty release note is worse than a
      # release that stopped.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release-notes.sh "$TAG" RELEASE_NOTES.md

      # Everything the old shell steps did - cross-compile, tarballs,
      # SHA256SUMS, third-party licences, publish - now comes from
      # .goreleaser.yaml, plus the packages, SBOMs and signatures.
      - name: Build, package, sign and publish
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Writing the cask into henriquemenezes/homebrew-tap is a push to
          # another repository, which the token above is not allowed to make.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Set explicitly rather than through --release-notes: passing that flag
      # alongside a disabled changelog pipe published an empty body once, with
      # no error anywhere. This cannot fail quietly.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --notes-file RELEASE_NOTES.md

      - name: The published notes must match the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # $(...) drops every trailing newline and printf puts exactly one
          # back, on both sides: reading the body back adds one of its own, and
          # without this the check would fail on every release over a blank line.
          printf '%s\n' "$(gh release view "$TAG" --json body -q .body)" >published.md
          printf '%s\n' "$(cat RELEASE_NOTES.md)" >expected.md
          if [ ! -s published.md ] || ! grep -q '[^[:space:]]' published.md; then
            echo "::error::the release body is empty"
            exit 1
          fi
          diff -u expected.md published.md || {
            echo "::error::the published notes differ from CHANGELOG.md"
            exit 1
          }

      # Binds every artefact to the commit, workflow and runner that produced
      # it. Users verify with `gh attestation verify <file> -R <repo>`.
      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
