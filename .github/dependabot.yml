# Dependency updates. See
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # A backup tool ships its dependencies inside a static binary, so an upstream
  # fix only reaches users through a release here.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"

  # Keeps the pinned action majors in ci.yml and release.yml current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
