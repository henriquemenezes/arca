<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-label="arca — single-file encrypted backups for Unix-like systems">
  <title>arca</title>

  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0D1117"/>
  <ellipse cx="640" cy="140" rx="520" ry="180" fill="url(#glow)"/>

  <!-- Lockup: mark + drawn wordmark + cursor. No font dependency here. -->
  <g transform="translate(349.1 30) scale(1.28)">
    <g transform="translate(20 20) scale(0.46875)">
      <g id="arca-mark">
        <g fill="none" stroke="#58A6FF" stroke-linecap="round">
          <path d="M24 212q14-13 28 0t28 0t28 0t28 0t28 0t28 0t28 0" stroke-width="12"/>
          <path d="M52 238q14-13 28 0t28 0t28 0t28 0t28 0" stroke-width="10" opacity="0.5"/>
        </g>
        <rect x="76" y="56" width="104" height="76" rx="6" fill="#0D1117" stroke="#3FB950" stroke-width="8"/>
        <path d="M16 126H240l-24 58c-38 24-138 24-176 0Z" fill="#56D364"/>
        <path d="M58 68 96 24h64l38 44Z" fill="#3FB950" stroke="#3FB950" stroke-width="10" stroke-linejoin="round"/>
        <g fill="#E3B341">
          <circle cx="128" cy="93" r="11"/>
          <path d="M121 101 117 117h22l-4-16Z"/>
        </g>
      </g>
    </g>
    <g id="arca-wordmark" fill="none" stroke="#E6EDF3" stroke-width="9"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="194" cy="80" r="19.5"/>
      <path d="M213.5 60.5v39"/>
      <path d="M236.5 99.5v-39"/>
      <path d="M236.5 76.5a16 16 0 0 1 16-16"/>
      <path d="M306.19 64.03a19.5 19.5 0 1 0 0 31.94"/>
      <circle cx="357" cy="80" r="19.5"/>
      <path d="M376.5 60.5v39"/>
    </g>
    <rect x="405" y="56" width="22" height="48" rx="2" fill="#56D364"/>
  </g>

  <text x="640" y="266" text-anchor="middle" fill="#8B949E" font-size="25"
        font-family="'JetBrains Mono','JetBrainsMono Nerd Font Mono','DejaVu Sans Mono',monospace">Single-file encrypted backups for Unix-like systems</text>

  <rect x="200" y="320" width="880" height="193" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>

  <g font-size="25" xml:space="preserve"
     font-family="'JetBrains Mono','JetBrainsMono Nerd Font Mono','DejaVu Sans Mono',monospace">
    <text x="272" y="375"><tspan fill="#56D364">$</tspan><tspan fill="#E6EDF3"> arca backup --source ~/Documents -o /media/usb/</tspan></text>
    <text x="272" y="423" fill="#8B949E">  arca-laptop-2026-09-30T03-10-45Z.tar.zst.age</text>
    <text x="272" y="471"><tspan fill="#56D364">$</tspan><tspan fill="#E6EDF3"> arca restore ARCHIVE --target ~/Documents</tspan></text>
  </g>

  <text x="640" y="572" text-anchor="middle" fill="#6E7681" font-size="22"
        font-family="'JetBrains Mono','JetBrainsMono Nerd Font Mono','DejaVu Sans Mono',monospace">one opaque file — and no arca needed to restore it</text>
</svg>
